name: daily-reminder-backend

services:
  users-db-setup:
    image: postgres:16-alpine
    environment:
      DB_HOST: ${USERS_DB_HOST:?USERS_DB_HOST is required}
      DB_PORT: ${USERS_DB_PORT:-5432}
      DB_NAME: ${USERS_DB_NAME:?USERS_DB_NAME is required}
      DB_USER: ${USERS_DB_USER:?USERS_DB_USER is required}
      DB_PASSWORD: ${USERS_DB_PASSWORD:?USERS_DB_PASSWORD is required}
    volumes:
      - ./users/database/init.sql:/opt/daily-reminder/init.sql:ro
      - ./users/database/upgrade.sql:/opt/daily-reminder/upgrade.sql:ro
      - ./users/database/setup.sh:/opt/daily-reminder/setup.sh:ro
    command: ["sh", "/opt/daily-reminder/setup.sh"]
    restart: "no"

  academic-reminder-db-setup:
    image: postgres:16-alpine
    environment:
      DB_HOST: ${ACADEMIC_DB_HOST:?ACADEMIC_DB_HOST is required}
      DB_PORT: ${ACADEMIC_DB_PORT:-5432}
      DB_NAME: ${ACADEMIC_DB_NAME:?ACADEMIC_DB_NAME is required}
      DB_USER: ${ACADEMIC_DB_USER:?ACADEMIC_DB_USER is required}
      DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:?ACADEMIC_DB_PASSWORD is required}
    volumes:
      - ./academic-reminder/database/init.sql:/opt/daily-reminder/init.sql:ro
      - ./academic-reminder/database/upgrade.sql:/opt/daily-reminder/upgrade.sql:ro
      - ./academic-reminder/database/setup.sh:/opt/daily-reminder/setup.sh:ro
    command: ["sh", "/opt/daily-reminder/setup.sh"]
    restart: "no"

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://${USERS_DB_HOST}:${USERS_DB_PORT:-5432}/${USERS_DB_NAME}?sslmode=${DB_SSLMODE:-require}
      DB_USER: ${USERS_DB_USER}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:?COGNITO_DOMAIN is required}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    expose:
      - "8081"
    depends_on:
      users-db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  academic-reminder:
    build:
      context: ./academic-reminder
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://${ACADEMIC_DB_HOST}:${ACADEMIC_DB_PORT:-5432}/${ACADEMIC_DB_NAME}?sslmode=${DB_SSLMODE:-require}
      DB_USER: ${ACADEMIC_DB_USER}
      DB_PASSWORD: ${ACADEMIC_DB_PASSWORD}
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      USERS_SERVICE_URL: http://users:8081
      USERS_SERVICE_TIMEOUT_MS: ${USERS_SERVICE_TIMEOUT_MS:-3000}
    expose:
      - "8082"
    depends_on:
      academic-reminder-db-setup:
        condition: service_completed_successfully
      users:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      users:
        condition: service_healthy
      academic-reminder:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health/users >/dev/null && wget -q -O - http://127.0.0.1/health/academic-reminder >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped
