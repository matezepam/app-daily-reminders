name: Validate Application

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  academic-backend:
    name: Test academic backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academic-reminder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-backend-test-report
          path: academic-reminder/build/reports/tests/test
          if-no-files-found: ignore

  users-backend:
    name: Test users backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: users
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-backend-test-report
          path: users/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build web application
        run: npm run build:web

  cognito-registration:
    name: Test Cognito role registration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/aws/cognito-registration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install AWS SDK
        run: python -m pip install "boto3>=1.34,<2"

      - name: Run Lambda tests
        run: python -m unittest discover -v

      - name: Validate deployment script syntax
        run: bash -n deploy.sh

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    env:
      COGNITO_USER_POOL_ID: us-east-1_ci
      COGNITO_CLIENT_ID: ci-client
      COGNITO_DOMAIN: ci.auth.us-east-1.amazoncognito.com
      DEMO_PROFESSOR_SUB: ci-professor
      DEMO_STUDENT_SUB: ci-student
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: docker compose config --quiet

      - name: Validate production backend configuration
        env:
          COGNITO_REGION: us-east-1
          CORS_ALLOWED_ORIGINS: https://frontend.example.com
          USERS_DB_HOST: users.example.com
          USERS_DB_NAME: users_db
          USERS_DB_USER: users_app
          USERS_DB_PASSWORD: ci-users-password
          ACADEMIC_DB_HOST: academic.example.com
          ACADEMIC_DB_NAME: academic_reminder_db
          ACADEMIC_DB_USER: academic_app
          ACADEMIC_DB_PASSWORD: ci-academic-password
        run: docker compose -f compose.production.yml config --quiet
