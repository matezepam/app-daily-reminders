spring:
  application:
    name: academic-reminder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_reminder_db}
    username: ${DB_USER:academic_app}
    password: ${DB_PASSWORD:change_me_academic}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: 8082
  error:
    include-message: never

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:9090}
  cognito:
    region: ${COGNITO_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    issuer-uri: ${COGNITO_ISSUER_URI:}
  clients:
    users:
      base-url: ${USERS_SERVICE_URL:http://users:8081}
      timeout-ms: ${USERS_SERVICE_TIMEOUT_MS:3000}
  scheduling:
    expiration-delay-ms: ${EXPIRATION_DELAY_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | sub=%X{sub:-anonimo} | %logger{40} | %msg%n"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
