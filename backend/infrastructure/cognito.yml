AWSTemplateFormatVersion: "2010-09-09"
Description: Daily Reminder Cognito authentication resources

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

Resources:
  DailyReminderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub daily-reminder-${Environment}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7

  DailyReminderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub daily-reminder-${Environment}-client
      UserPoolId: !Ref DailyReminderUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
      WriteAttributes:
        - email

Outputs:
  AwsRegion:
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Value: !Ref DailyReminderUserPool
  CognitoClientId:
    Value: !Ref DailyReminderUserPoolClient
