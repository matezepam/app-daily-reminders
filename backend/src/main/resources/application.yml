spring:
  application:
    name: daily-reminder-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daily_reminder}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  cognito:
    region: ${AWS_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    client-secret: ${COGNITO_CLIENT_SECRET:}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
