name: academic-reminder

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: /api
        EXPO_PUBLIC_COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
        EXPO_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HOST_PORT:-9090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      users:
        condition: service_healthy
      academic-reminder:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health/users >/dev/null && wget -q -O - http://127.0.0.1/health/academic-reminder >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://users-db:5432/${USERS_DB_NAME:-users_db}
      DB_USER: ${USERS_DB_USER:-users_app}
      DB_PASSWORD: ${USERS_DB_PASSWORD:-change_me_users}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:?COGNITO_DOMAIN is required}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:9090}
    expose:
      - "8081"
    depends_on:
      users-db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  academic-reminder:
    build:
      context: ./academic-reminder
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://academic-reminder-db:5432/${ACADEMIC_DB_NAME:-academic_reminder_db}
      DB_USER: ${ACADEMIC_DB_USER:-academic_app}
      DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-change_me_academic}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:9090}
      USERS_SERVICE_URL: http://users:8081
      USERS_SERVICE_TIMEOUT_MS: ${USERS_SERVICE_TIMEOUT_MS:-3000}
    expose:
      - "8082"
    depends_on:
      academic-reminder-db-setup:
        condition: service_completed_successfully
      users:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_app}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-change_me_users}
      DEMO_PROFESSOR_SUB: ${DEMO_PROFESSOR_SUB:?DEMO_PROFESSOR_SUB is required}
      DEMO_STUDENT_SUB: ${DEMO_STUDENT_SUB:?DEMO_STUDENT_SUB is required}
    expose:
      - "5432"
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./users/database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./users/database/seed-demo.sh:/docker-entrypoint-initdb.d/002_seed_demo.sh:ro
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - logging_collector=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-users_app} -d ${USERS_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  academic-reminder-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ACADEMIC_DB_NAME:-academic_reminder_db}
      POSTGRES_USER: ${ACADEMIC_DB_USER:-academic_app}
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD:-change_me_academic}
      DEMO_PROFESSOR_SUB: ${DEMO_PROFESSOR_SUB:?DEMO_PROFESSOR_SUB is required}
      DEMO_STUDENT_SUB: ${DEMO_STUDENT_SUB:?DEMO_STUDENT_SUB is required}
    expose:
      - "5432"
    volumes:
      - academic_reminder_data:/var/lib/postgresql/data
      - ./academic-reminder/database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./academic-reminder/database/seed-demo.sh:/docker-entrypoint-initdb.d/002_seed_demo.sh:ro
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_duration=on
      - -c
      - log_min_duration_statement=0
      - -c
      - "log_line_prefix=%m [%p] %u@%d app=%a "
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - logging_collector=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACADEMIC_DB_USER:-academic_app} -d ${ACADEMIC_DB_NAME:-academic_reminder_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  academic-reminder-db-setup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${ACADEMIC_DB_PASSWORD:-change_me_academic}
    volumes:
      - ./academic-reminder/database/upgrade.sql:/opt/academic-reminder/upgrade.sql:ro
    command:
      - psql
      - --host=academic-reminder-db
      - --username=${ACADEMIC_DB_USER:-academic_app}
      - --dbname=${ACADEMIC_DB_NAME:-academic_reminder_db}
      - --set=ON_ERROR_STOP=1
      - --file=/opt/academic-reminder/upgrade.sql
    depends_on:
      academic-reminder-db:
        condition: service_healthy
    restart: "no"

  users-db-setup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${USERS_DB_PASSWORD:-change_me_users}
    volumes:
      - ./users/database/upgrade.sql:/opt/users/upgrade.sql:ro
    command:
      - psql
      - --host=users-db
      - --username=${USERS_DB_USER:-users_app}
      - --dbname=${USERS_DB_NAME:-users_db}
      - --set=ON_ERROR_STOP=1
      - --file=/opt/users/upgrade.sql
    depends_on:
      users-db:
        condition: service_healthy
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:9.6
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:-change_me_users}
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-change_me_academic}
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      users-db:
        condition: service_healthy
      academic-reminder-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/misc/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  users_data:
  academic_reminder_data:
  pgadmin_data:
