user nginx;
worker_processes auto;
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format gateway '$time_iso8601 | INFO | nginx | sub=anonimo | nginx.access | event=http.response | msg=$status $request_method $uri | request_id=$request_id upstream=$upstream_addr duration=$request_time';
    access_log /dev/stdout gateway;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream users_service {
        zone users_service 64k;
        server users:8081 resolve;
        keepalive 16;
    }

    upstream academic_reminder_service {
        zone academic_reminder_service 64k;
        server academic-reminder:8082 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /health/users {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://users_service/actuator/health;
        }

        location = /health/academic-reminder {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://academic_reminder_service/actuator/health;
        }

        location /users/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://users_service;
        }

        location /academic-reminder/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://academic_reminder_service;
        }

        location / {
            return 404 '{"status":404,"error":"Not Found","message":"Gateway route not found","path":"/"}';
            add_header Content-Type application/json;
        }
    }
}
